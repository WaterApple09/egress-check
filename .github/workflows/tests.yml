name: Offline MTR regression tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  awk-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        awk: [gawk, mawk, 'busybox awk']
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y gawk mawk busybox jq
      - run: bash -n ip.sh
      - run: python3 -m unittest discover -s tests -v
        env:
          EGRESS_TEST_AWK: ${{ matrix.awk }}
  legacy-mawk:
    runs-on: ubuntu-latest
    container: ubuntu:20.04
    steps:
      - run: apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y git ca-certificates python3 mawk jq
      - uses: actions/checkout@v4
      - name: Verify this awk cannot match interval expressions
        run: mawk 'BEGIN { exit ("8.8.8.8" ~ /^([0-9]{1,3}\.){3}[0-9]{1,3}$/) }'
      - run: bash -n ip.sh
      - run: python3 -m unittest discover -s tests -v
        env:
          EGRESS_TEST_AWK: mawk
